name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-dev.txt
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Run Linux GUI smoke
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          xvfb-run -a python tests/gui_smoke.py
      - name: Compile Python sources
        run: python -m py_compile app/engine.py app/main.py app/adapters.py app/policies.py app/release.py
      - name: Validate Windows release layout
        run: python -m app.release .

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install audit tool
        run: python -m pip install --disable-pip-version-check pip-audit==2.9.0
      - name: Audit pinned dependencies
        run: pip-audit -r requirements.lock.txt
