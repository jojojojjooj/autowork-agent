name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-dev.txt
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Compile Python sources
        run: python -m py_compile app/engine.py app/main.py app/adapters.py app/policies.py app/release.py
      - name: Validate Windows release layout
        run: python -m app.release .
